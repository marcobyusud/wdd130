<svg xmlns="http://www.w3.org/2000/svg" width="600" height="800" viewBox="0 0 600 800">
  <rect width="600" height="800" fill="#ffffff" stroke="#333333" stroke-width="2"/>
  
  <!-- Header -->
  <rect x="20" y="20" width="560" height="70" fill="#f0f0f0" stroke="#666666" stroke-width="2"/>
  <rect x="35" y="32" width="80" height="45" fill="#cccccc" stroke="#666666"/>
  <text x="75" y="60" font-family="Arial" font-size="14" text-anchor="middle" fill="#333333">Logo</text>
  <rect x="180" y="40" width="85" height="30" fill="#dddddd" stroke="#666666"/>
  <rect x="275" y="40" width="85" height="30" fill="#dddddd" stroke="#666666"/>
  <rect x="370" y="40" width="85" height="30" fill="#dddddd" stroke="#666666"/>
  <rect x="465" y="40" width="85" height="30" fill="#dddddd" stroke="#666666"/>
  <text x="365" y="60" font-family="Arial" font-size="12" text-anchor="middle" fill="#333333">Navegação (Flex)</text>

  <!-- H1 -->
  <text x="300" y="125" font-family="Arial" font-weight="bold" font-size="18" text-anchor="middle" fill="#333333">H1: Fale Conosco - White Water Rafting</text>

  <!-- Seção 1: Info + Mapa -->
  <rect x="20" y="145" width="560" height="170" fill="#fafafa" stroke="#666666" stroke-width="1.5"/>
  <text x="300" y="168" font-family="Arial" font-weight="bold" font-size="14" text-anchor="middle" fill="#333333">Informações de Contato</text>
  <rect x="35" y="180" width="250" height="120" fill="#eeeeee" stroke="#999999"/>
  <text x="160" y="220" font-family="Arial" font-size="12" text-anchor="middle" fill="#333333">Endereço</text>
  <text x="160" y="245" font-family="Arial" font-size="12" text-anchor="middle" fill="#333333">Telefone</text>
  <text x="160" y="270" font-family="Arial" font-size="12" text-anchor="middle" fill="#333333">E-mail</text>
  <rect x="310" y="180" width="255" height="120" fill="#dddddd" stroke="#666666"/>
  <text x="437" y="245" font-family="Arial" font-size="13" text-anchor="middle" fill="#333333">Google Maps (iframe)</text>

  <!-- Seção 2: Equipe -->
  <rect x="20" y="330" width="560" height="145" fill="#fafafa" stroke="#666666" stroke-width="1.5"/>
  <text x="300" y="352" font-family="Arial" font-weight="bold" font-size="14" text-anchor="middle" fill="#333333">Nossa Equipe (3 Funcionários)</text>
  <rect x="45" y="365" width="140" height="75" fill="#dddddd" stroke="#666666"/>
  <text x="115" y="458" font-family="Arial" font-size="11" text-anchor="middle" fill="#333333">Funcionário 1 + Cargo</text>
  <rect x="230" y="365" width="140" height="75" fill="#dddddd" stroke="#666666"/>
  <text x="300" y="458" font-family="Arial" font-size="11" text-anchor="middle" fill="#333333">Funcionário 2 + Cargo</text>
  <rect x="415" y="365" width="140" height="75" fill="#dddddd" stroke="#666666"/>
  <text x="485" y="458" font-family="Arial" font-size="11" text-anchor="middle" fill="#333333">Funcionário 3 + Cargo</text>

  <!-- Seção 3: Formulário -->
  <rect x="20" y="490" width="560" height="220" fill="#fafafa" stroke="#666666" stroke-width="1.5"/>
  <text x="300" y="512" font-family="Arial" font-weight="bold" font-size="14" text-anchor="middle" fill="#333333">Formulário de Contato</text>
  <rect x="100" y="525" width="400" height="22" fill="#ffffff" stroke="#999999"/>
  <text x="110" y="540" font-family="Arial" font-size="11" fill="#555555">Nome + E-mail (inputs text/email)</text>
  <rect x="100" y="555" width="400" height="35" fill="#ffffff" stroke="#999999"/>
  <text x="110" y="577" font-family="Arial" font-size="11" fill="#555555">(o) Consulta Geral  (o) Reserva  (o) Sugestão (radio)</text>
  <rect x="100" y="598" width="400" height="40" fill="#ffffff" stroke="#999999"/>
  <text x="110" y="622" font-family="Arial" font-size="11" fill="#555555">Mensagem (textarea)</text>
  <text x="110" y="656" font-family="Arial" font-size="11" fill="#333333">[x] Quero receber a newsletter mensal (checkbox)</text>
  <rect x="100" y="668" width="400" height="30" fill="#1f4788" stroke="#1f4788"/>
  <text x="300" y="688" font-family="Arial" font-weight="bold" font-size="12" text-anchor="middle" fill="#ffffff">Botão: Enviar Mensagem (submit)</text>

  <!-- Footer -->
  <rect x="20" y="725" width="560" height="55" fill="#f0f0f0" stroke="#666666" stroke-width="2"/>
  <text x="180" y="757" font-family="Arial" font-size="12" text-anchor="middle" fill="#333333">Copyright + Link do Wireframe</text>
  <rect x="440" y="738" width="28" height="28" fill="#cccccc" stroke="#666666"/>
  <rect x="478" y="738" width="28" height="28" fill="#cccccc" stroke="#666666"/>
  <rect x="516" y="738" width="28" height="28" fill="#cccccc" stroke="#666666"/>
</svg>

